        - application/x-www-form-urlencoded
      produces:
        - application/json
      responses:
        '200':
          description: Success
          schema:
            allOf:
              - $ref: '#/definitions/GeneralAPIResponse'
              - type: object
                properties:
                  users:
                    type: array
                    items:
                      $ref: '#/definitions/User'
      security:
        - Bearer: []
  /getTechnicians:
    post:
      tags:
        - Users
      summary: To get all technicians created by a company
      description: ''
