swagger: '2.0'
info:
  title: BlueClerk
  description: APIs for both app and website
  version: 1.0.0
host: 'blueclerk-node-api.deploy.blueclerk.com'
basePath: /api/v1
schemes:
  - https
tags:
  - name: Auth
    description: For login and signup
  - name: Social Auth
    description: For social login and signup
  - name: Industry
    description: For the industry company works in
  - name: Users
    description: For all kind of users
  - name: Company
    description: For all kind of company stuff
  - name: Email Default
    description: For all kind of company email default
  - name: Equipment Type
    description: For equipment types
  - name: Equipment Brand
    description: For equipment brands
  - name: Customer
    description: For customers of a company
  - name: Customer Equipment
    description: For equipments of a customer
  - name: Contact
    description: For contact of customer or job location
  - name: Location Tags
    description: For location tags
  - name: Customer Equipment Detail
    description: For Limited information of customer equipment and jobs
  - name: Company Equipment
  - name: Company Card
    description: For payment methods of a company
  - name: Company Equipment History
    description: For company equipment's Check In Check Out history
  - name: Inventory
    description: For Inventory of company equipments
  - name: Job Type
    description: For job types
  - name: Items
    description: For invoice items
  - name: Item Pricing Tiers
    desdription: For company item pricing tiers
  - name: Job Charges
    description: For job charges
  - name: Job Site
    description: For company Job Sites
  - name: Service Ticket
    description: For creating and getting service tickets
  - name: Notification
    description: For retrieve and update notification
  - name: Job
    description: For scheduled jobs
  - name: Part Inventory
    description: For parts inventory
  - name: Purchase Order
    description: For company purchase orders
  - name: Estimate
    description: For Estimate
  - name: Reports
    description: For job and other reports
  - name: Sales Tax
    description: For salesTax
  - name: Invoice
    description: For invoices of jobs
  - name: Payment
    description: For payments of invoices
  - name: Image
    description: For images
  - name: Group
    description: For Groups  
  - name: Tags
    description: For Placing Tags Order
  - name: Subscription
  - name: Permission
    description: For employee or company permissions
  - name: Vendor
    description: For vendor login, signup and details
  - name: Import Customer
    description: For import customers through excel file
  - name: Quickbooks Integration
    description: For Quickbooks customers integration
    
paths:
  /login:
    post:
      tags:
        - Auth
      summary: Login all kind of users and get auth token for further requests
      description: ''
      consumes:
        - application/x-www-form-urlencoded
      produces:
        - application/json
      parameters:
        - name: email
          in: formData
          required: true
          type: string
        - name: password
          in: formData
          required: true
          type: string
      responses:
        '200':
          description: Success
          schema:
            $ref: '#/definitions/AuthAPIResponse'
  /signUp:
    post:
      tags:
        - Auth
      summary: Sign up as company Admin and creates company
      description: ''
      consumes:
        - application/x-www-form-urlencoded
      produces:
        - application/json
      parameters:
        - name: email
          in: formData
          required: true
          type: string
          description: email address of admin of a company
        - name: password
          in: formData
          required: true
          type: string
          description: password for company admin login
        - name: firstName
          in: formData
          required: true
          type: string
          description: first Name of admin of company
        - name: lastName
          in: formData
          required: true
          type: string
          description: last Name of admin of company
        - name: phone
          in: formData
          required: true
          type: string
          description: phone number of admin of company
        - name: companyName
          in: formData
          required: true
          type: string
        - name: industryId
          in: formData
          description: >-
            Id of the selected industry from the industries fetched with
            /getIndustries api
          required: true
          type: string
      responses:
        '200':
          description: Success
          schema:
            $ref: '#/definitions/AuthAPIResponse'
  /searchContractor:
    post:
      tags:
        - Vendor
      summary: Search for vendors
      description: 'Company can serach vendor'
      consumes:
        - application/x-www-form-urlencoded
      produces:
        - application/json
      parameters:
        - name: email
          in: formData
          required: true
          type: string
      responses:
        '200':
          description: Success
          schema:
            $ref: '#/definitions/User'
      security:
        - Bearer: []
  /inviteContractor:
    post:
      tags:
        - Vendor
      summary: To invite vendor to join BlueClerk
      description: A company can invite a vendor
      consumes:
        - application/x-www-form-urlencoded
      produces:
        - application/json
      parameters:
        - name: email
          in: formData
          description: email of vendor to invite
          required: true
          type: string
      responses:
        '200':
          description: Success
          schema:
            $ref: '#/definitions/GeneralAPIResponse'
      security:
        - Bearer: []
  /startContract:
    post:
      tags:
        - Vendor
      summary: To send offer to a vendor
      description: A company can initiate a contract with vendor
      consumes:
        - application/x-www-form-urlencoded
      produces:
        - application/json
      parameters:
        - name: contractorId
          in: formData
          description: Id of a vendor fetched with /searchContractor api
          required: true
          type: string
      responses:
        '200':
          description: Success
          schema:
            $ref: '#/definitions/GeneralAPIResponse'
      security:
        - Bearer: []
  /getContracts:
    post:
      tags:
        - Vendor
      summary: To get all contracts by vendor
      description: ''
      consumes:
        - application/x-www-form-urlencoded
      produces:
        - application/json
      responses:
        '200':
          description: Success
          schema:
            allOf:
              - $ref: '#/definitions/GeneralAPIResponse'
              - type: object
                properties:
                  industries:
                    type: array
                    items:
                      $ref: '#/definitions/Contract'
      security:
        - Bearer: []
  /getCompanyContracts:
    post:
      tags:
        - Vendor
      summary: To get all contracts by company
      description: ''
      consumes:
        - application/x-www-form-urlencoded
      produces:
        - application/json
      responses:
        '200':
          description: Success
          schema:
            allOf:
              - $ref: '#/definitions/GeneralAPIResponse'
              - type: object
                properties:
                  industries:
                    type: array
                    items:
                      $ref: '#/definitions/Contract'
      security:
        - Bearer: []
  /getContractorDetail:
    post:
      tags:
        - Vendor
      summary: To get detail of a contractor
      description: ''
      consumes:
        - application/x-www-form-urlencoded
      produces:
        - application/json
      responses:
        '200':
          description: Success
          schema:
            allOf:
              - $ref: '#/definitions/GeneralAPIResponse'
              - type: object
                properties:
                  industries:
                    type: array
                    items:
                      $ref: '#/definitions/Contractor'
      security:
        - Bearer: []
  /getCompanyContractorActivity:
    post:
      tags:
        - Vendor
      summary: To get all company vendors activity
      description: ''
      consumes:
        - application/x-www-form-urlencoded
      produces:
        - application/json
      responses:
        '200':
          description: Success
          schema:
            allOf:
              - $ref: '#/definitions/GeneralAPIResponse'
              - type: object
                properties:
                  contractorActivity:
                    type: array
                    items:
                      $ref: '#/definitions/ContractorActivity'
      security:
        - Bearer: []
  /acceptOrRejectContract:
    post:
      tags:
        - Vendor
      summary: Accepting or rejecting a contract by vendor
      # description: Only a global admin can create an industry
      consumes:
        - application/x-www-form-urlencoded
      produces:
        - application/json
      parameters:
        - name: contractId
          in: formData
          description: Id of a contract fetched by /getContracts api
          required: true
          type: string
        - name: status
          in: formData
          description: status of contract accept / reject
          required: true
          type: string
      responses:
        '200':
          description: Success
          schema:
            $ref: '#/definitions/GeneralAPIResponse'
      security:
        - Bearer: []
  /CancelOrFinish:
    post:
      tags:
        - Vendor
      summary: Canceling of Finishing contract by company
      # description: Only a global admin can create an industry
      consumes:
        - application/x-www-form-urlencoded
      produces:
        - application/json
      parameters:
        - name: contractId
          in: formData
          description: Id of a contract fetched by /getContracts api
          required: true
          type: string
        - name: status
          in: formData
          description: status of contract cancel / finish
          required: true
          type: string
      responses:
        '200':
          description: Success
          schema:
            $ref: '#/definitions/GeneralAPIResponse'
      security:
        - Bearer: []
  /upgradeToCompany:
    post:
      tags:
        - Vendor
      summary: Upgrading from vendor to company account
      # description: Only a global admin can create an industry
      consumes:
        - application/x-www-form-urlencoded
      produces:
        - application/json
      parameters:
        - name: token
          in: formData
          description: strip token got from mobile end
          required: true
          type: string
        - name: ending
          in: formData
          description: last 4 digits of card
          required: true
          type: string
      responses:
        '200':
          description: Success
          schema:
            $ref: '#/definitions/GeneralAPIResponse'
      security:
        - Bearer: []
  /changeContractorPermission:
    post:
      tags:
        - Permission
      summary: Assigning permissions to contractor
      # description: Only a global admin can create an industry
      consumes:
        - application/x-www-form-urlencoded
      produces:
        - application/json
      parameters:
        - name: contractorId
          in: formData
          description: Id of a contractor
          required: true
          type: string
        - name: permissions
          in: formData
          description: comma seprated permissions
          required: true
          type: string
      responses:
        '200':
          description: Success
          schema:
            $ref: '#/definitions/GeneralAPIResponse'
      security:
        - Bearer: []
  /contractorSignup:
    post:
      tags:
        - Auth
      summary: Sign up for contractor
      description: ''
      consumes:
        - application/x-www-form-urlencoded
      produces:
        - application/json
      parameters:
        - name: email
          in: formData
          required: true
          type: string
        - name: password
          in: formData
          required: true
          type: string
        - name: firstName
          in: formData
          required: true
          type: string
        - name: lastName
          in: formData
          required: true
          type: string
        - name: phone
          in: formData
          required: true
          type: string
        - name: companyName
          in: formData
          required: true
          type: string
        - name: industryId
          in: formData
          description: >-
            Id of the selected industry from the industries fetched with
            /getIndustries api
          required: true
          type: string
      responses:
        '200':
          description: Success
          schema:
            $ref: '#/definitions/AuthAPIResponse'
  /checkAndGet:
    post:
      tags:
        - Social Auth
      summary: Check if user has already signed up using Facebook or google
      description: ''
      consumes:
        - application/x-www-form-urlencoded
      produces:
        - application/json
      parameters:
        - name: socialId
          in: formData
          description: 'Social id returned by facebook or google sdk'
          required: true
          type: string
        - name: connectorType
          in: formData
          description: '0 for Facebook and 1 for Google'
          required: true
          type: number
      responses:
        '200':
          description: Success
          schema:
            $ref: '#/definitions/AuthAPIResponse'
  /signUpSocial:
    post:
      tags:
        - Social Auth
      summary: Sign up for company using Facebook or Google
      description: ''
      consumes:
        - application/x-www-form-urlencoded
      produces:
        - application/json
      parameters:
        - name: email
          in: formData
          required: true
          type: string
          description: email address of admin of a company
        - name: firstName
          in: formData
          required: true
          type: string
          description: first Name of admin of company
        - name: lastName
          in: formData
          required: true
          type: string
          description: last Name of admin of company
        - name: phone
          in: formData
          required: true
          type: string
          description: phone number of admin of company
        - name: companyName
          in: formData
          required: true
          type: string
        - name: industryId
          in: formData
          description: >-
            Id of the selected industry from the industries fetched with
            /getIndustries api
          required: true
          type: string
        - name: socialId
          in: formData
          description: >-
            Social id from Facebook or Google sdk
          required: true
          type: string
        - name: connectorType
          in: formData
          description: >-
            0 for Facebook and 1 for Google
          required: true
          type: number
      responses:
        '200':
          description: Success
          schema:
            $ref: '#/definitions/AuthAPIResponse'
  /contractorSignUpSocial:
    post:
      tags:
        - Social Auth
      summary: Sign up for contractor using Facebook or Google
      description: ''
      consumes:
        - application/x-www-form-urlencoded
      produces:
        - application/json
      parameters:
        - name: email
          in: formData
          required: true
          type: string
        - name: firstName
          in: formData
          required: true
          type: string
        - name: lastName
          in: formData
          required: true
          type: string
        - name: phone
          in: formData
          required: true
          type: string
        - name: companyName
          in: formData
          required: true
          type: string
        - name: industryId
          in: formData
          description: >-
            Id of the selected industry from the industries fetched with
            /getIndustries api
          required: true
          type: string
        - name: socialId
          in: formData
          description: >-
            Social id from Facebook or Google sdk
          required: true
          type: string
        - name: connectorType
          in: formData
          description: >-
            0 for Facebook and 1 for Google
          required: true
          type: number
      responses:
        '200':
          description: Success
          schema:
            $ref: '#/definitions/AuthAPIResponse'
  /setCustomWorkOrderNumber:
    post:
      tags:
        - Job
      summary: Setting custom work order number for service tickets and job
      description: ''
      consumes:
        - application/x-www-form-urlencoded
      produces:
        - application/json
      parameters:
        - name: workOrderNumber
          in: formData
          type: number
        - name: prefix
          in: formData
          type: string
      responses:
        '200':
          description: Success
          schema:
            $ref: '#/definitions/GeneralAPIResponse'
      security:
        - Bearer: []
  /getCurrentJobId:
    post:
      tags:
        - Job
      summary: Getting latest custom work order number for service tickets and job
      description: ''
      consumes:
        - application/x-www-form-urlencoded
      produces:
        - application/json
      responses:
        '200':
          description: Success
          schema:
            $ref: '#/definitions/WorkOrderNumberResponse'
      security:
        - Bearer: []
  /setCustomInvoiceNumber:
    post:
      tags:
        - Invoice
      summary: Setting custom invoce number for invoices
      description: ''
      consumes:
        - application/x-www-form-urlencoded
      produces:
        - application/json
      parameters:
        - name: invoiceNumber
          in: formData
          type: number
        - name: invoicePrefix
          in: formData
          type: string
      responses:
        '200':
          description: Success
          schema:
            $ref: '#/definitions/GeneralAPIResponse'
      security:
        - Bearer: []
  /getCurrentIvoiceNumber:
    post:
      tags:
        - Invoice
      summary: Getting current invoice numbe for company
      description: ''
      consumes:
        - application/x-www-form-urlencoded
      produces:
        - application/json
      responses:
        '200':
          description: Success
          schema:
            $ref: '#/definitions/InvoiceNumberResponse'
      security:
        - Bearer: []
