      description: (Had to make this using json as the body to avoid boolean value being converted to string, you can use only one of them or even none of them)
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - name: notificationId
        in: path
        type: string
        required: true
      - name: body
