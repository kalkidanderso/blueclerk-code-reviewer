      parameters:
        - name: customerId
          in: formData
          required: true
          type: string
        - name: name
          in: formData
          required: true
          type: string
        - name: email
          in: formData
          type: string
        - name: street
          in: formData
          type: string
        - name: city
          in: formData
          type: string
        - name: state
          in: formData
          type: string
        - name: zipCode
          in: formData
          type: string
        - name: contactName
          in: formData
          type: string
        - name: phone
          in: formData
          type: string
      responses:
        '200':
          description: Success
          schema:
            $ref: '#/definitions/GeneralAPIResponse'
      security:
        - Bearer: []
  /getCustomers:
    post:
      tags:
        - Customer
      summary: >-
        To get all customers of a company or company of employee.
      description: ''
      consumes:
        - application/x-www-form-urlencoded
      produces:
        - application/json
      parameters:
        - name: includeActive
          in: formData
          required: true
          type: boolean
          description: >-
            Should include active clients in the response. true->include
            false->don't include
        - name: includeNonActive
          in: formData
          required: true
          type: boolean
          description: >-
            Should include non-active clients in the response. true->include
            false->don't include
      responses:
        '200':
          description: Success
          schema:
            allOf:
              - $ref: '#/definitions/GeneralAPIResponse'
              - type: object
                properties:
                  customers:
                    type: array
                    items:
                      $ref: '#/definitions/Customer'
      security:
        - Bearer: []
  /createCustomerEquipment:
    post:
      tags:
        - Customer Equipment
      summary: To create an equipment for a customer
      description: ''
      consumes:
        - application/x-www-form-urlencoded
      produces:
        - application/json
      parameters:
        - name: model
          in: formData
          required: true
          type: string
        - name: serialNumber
          in: formData
          required: true
          type: string
        - name: nfcTag
          in: formData
          required: true
          type: string
        - name: imageUrl
          in: formData
          required: true
          type: string
        - name: equipmentTypeId
          in: formData
          required: true
          type: string
          description: >-
            Id of the selected equipment type from the list received in
            /getEquipmentTypes api
        - name: equipmentBrandId
          in: formData
          required: true
          type: string
          description: >-
            Id of the selected equipment brand from the list received in
            /getEquipmentBrands api
        - name: customerId
          in: formData
          required: true
          type: string
          description: >-
            Id of the selected customer from the list received in /getCustomers
            api
      responses:
        '200':
          description: Success
          schema:
            $ref: '#/definitions/GeneralAPIResponse'
      security:
        - Bearer: []
