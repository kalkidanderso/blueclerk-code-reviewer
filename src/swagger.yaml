  /createJob:
    post:
      tags:
        - Job
      summary: To create a job
      description: ''
      consumes:
        - application/x-www-form-urlencoded
      produces:
        - application/json
      parameters:
        - name: dateTime
          in: formData
          required: true
          type: string
          description: 'date time of job. e.g. 2019-12-22 20:30:00'
        - name: technicianId
          in: formData
          required: true
          type: string
          description: >-
            Id of a technician selected from the list received by
            /getTechnicians api
        - name: customerId
          in: formData
          required: true
          type: string
          description: >-
            Id of a customer selected from the list received by /getCustomers
            api
        - name: jobTypeId
          in: formData
          required: true
          type: string
          description: Id of a job type selected from the list received by /getJobTypes api
      responses:
        '200':
          description: Success
          schema:
            $ref: '#/definitions/GeneralAPIResponse'
      security:
        - Bearer: []
  /getJobs:
    post:
      tags:
        - Job
      summary: To get all jobs of a company or company of employee.
      description: ''
      consumes:
        - application/x-www-form-urlencoded
      produces:
        - application/json
      responses:
        '200':
          description: Success
          schema:
            allOf:
              - $ref: '#/definitions/GeneralAPIResponse'
              - type: object
                properties:
                  jobs:
                    type: array
                    items:
                      $ref: '#/definitions/Job'
      security:
        - Bearer: []
  /getTechnicianJobs:
    post:
      tags:
        - Job
      summary: To get all jobs of a technician.
      description: ''
      consumes:
        - application/x-www-form-urlencoded
      produces:
        - application/json
      responses:
        '200':
          description: Success
          schema:
            allOf:
              - $ref: '#/definitions/GeneralAPIResponse'
              - type: object
                properties:
                  jobs:
                    type: array
                    items:
                      $ref: '#/definitions/Job'
      security:
        - Bearer: []
  /updateJob:
    post:
      tags:
        - Job
      summary: To update job status with comment by tech
      description: ''
      consumes:
        - application/x-www-form-urlencoded
      produces:
        - application/json
      parameters:
        - name: jobId
          in: formData
          required: true
          type: string
          description: >-
            Id of job to link to the scaned customer equipment
        - name: status
          in: formData
          required: true
          type: number
          description: Id of job status as number from one of these (PENDING => 0, STARTED => 1, FINISHED => 2).
        - name: comment
          in: formData
          required: true
          type: string
      responses:
        '200':
          description: Success
          schema:
            $ref: '#/definitions/GeneralAPIResponse'
      security:
        - Bearer: []
  /assignJobToEquipment:
    post:
      tags:
        - Job
      summary: To link job with customer equipment for history
      description: ''
      consumes:
        - application/x-www-form-urlencoded
      produces:
        - application/json
      parameters:
        - name: nfcTag
          in: formData
          required: true
          type: string
        - name: jobId
          in: formData
          required: true
          type: string
          description: >-
            Id of job to link to the scaned customer equipment
      responses:
        '200':
          description: Success
          schema:
            $ref: '#/definitions/GeneralAPIResponse'
      security:
        - Bearer: []
  /getCustomerEquipmentJobs:
    post:
      tags:
        - Customer Equipment
      summary: To link job to customer equipment for history
      description: ''
      consumes:
        - application/x-www-form-urlencoded
      produces:
        - application/json
      parameters:
        - name: equipmentId
          in: formData
          required: true
          type: string
      responses:
