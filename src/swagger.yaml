      tags:
        - Quickbooks Integration
      summary: BE callback to get authorization code from FE
      consumes:
        - application/x-www-form-urlencoded
      produces:
        - application/json
      parameters:
        - name: redirectUri
          in: query
          required: true
          type: string
          description: Frontend redirect uri
        - name: code
          in: query
          required: true
          type: string
        - name: state
          in: query
          required: true
          type: string
        - name: realmId
