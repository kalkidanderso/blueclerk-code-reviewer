        - name: serialNumber
          in: formData
          required: true
          type: string
        - name: typeId
          in: formData
          required: true
          type: string
        - name: brandId
          in: formData
          required: true
          type: string
        - name: imageUrl
          in: formData
          required: true
          type: string
        - name: nfcTag
          in: formData
          type: string
          description: required if qrCode not provided
        - name: qrCode
          in: formData
