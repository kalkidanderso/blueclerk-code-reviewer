        - application/json
      parameters:
        - name: dateTime
          in: formData
          required: true
          type: string
        - name: nfcTags
          in: formData
          type: string
          description: Comma seprated nfcTags (if there is no nfcTag scaned send empty)
        - name: qrCodes
          in: formData
          type: string
          description: Comma seprated qrCodes (if there is no qrCode scaned send empty)
      responses:
        '200':
          description: Success
          schema:
            $ref: '#/definitions/GeneralAPIResponse'
      security:
        - Bearer: []
  /getCompanyCards:
    post:
      tags:
      - Company Card
      summary: To get payment methods of a company
      description: ''
      consumes:
        - application/x-www-form-urlencoded
      produces:
        - application/json
      responses:
        '200':
          description: Success
          schema:
            allOf:
              - $ref: '#/definitions/GeneralAPIResponse'
              - type: object
                properties:
                  cards:
                    type: array
                    items:
                      $ref: '#/definitions/Card'
      security:
        - Bearer: []
  /addCompanyCard:
    post:
      tags:
        - Company Card
      summary: To add company card
      description: ''
      consumes:
        - application/x-www-form-urlencoded
      produces:
        - application/json
      parameters:
        - name: token
          in: formData
          required: true
          type: string
          description: token fetched by mobile from stripe
        - name: ending
          in: formData
          required: true
          type: string
          description: last 4 digits of company card
      responses:
        '200':
          description: Success
          schema:
            $ref: '#/definitions/GeneralAPIResponse'
      security:
        - Bearer: []
  /removeCompanyCard:
    post:
      tags:
        - Company Card
      summary: To remove company card
      description: ''
      consumes:
        - application/x-www-form-urlencoded
      produces:
        - application/json
      parameters:
        - name: cardId
          in: formData
          required: true
          type: string
          description: Id of card fetched from /getCompanyCards
      responses:
        '200':
          description: Success
          schema:
            $ref: '#/definitions/GeneralAPIResponse'
      security:
        - Bearer: []
  /placeOrder:
    post:
      tags:
        - Tags
      summary: To buy tags
      description: ''
      consumes:
        - application/x-www-form-urlencoded
      produces:
        - application/json
      parameters:
        - name: noOfTags
          in: formData
          required: true
          type: string
        - name: total
          in: formData
          required: true
          type: string
        - name: tax
          in: formData
          required: true
          type: string
        - name: cardId
          in: formData
          required: true
          type: string
          description: Id of company card for transaction fetched by /getCompanyCards.
        - name: street
          in: formData
          required: true
          type: string
        - name: city
          in: formData
          required: true
          type: string
        - name: state
          in: formData
          required: true
          type: string
        - name: zipCode
          in: formData
          required: true
          type: string
      responses:
        '200':
          description: Success
          schema:
            $ref: '#/definitions/GeneralAPIResponse'
      security:
        - Bearer: []
  /getOrders:
    post:
      tags:
      - Tags
      summary: To get tag orders of a company
      description: ''
      consumes:
        - application/x-www-form-urlencoded
      produces:
        - application/json
      responses:
        '200':
          description: Success
          schema:
            allOf:
              - $ref: '#/definitions/GeneralAPIResponse'
              - type: object
                properties:
                  groups:
                    type: array
                    items:
                      $ref: '#/definitions/Order'
      security:
        - Bearer: []
  /buySubscriptions:
    post:
      tags:
        - Subscription
      summary: For company to buy subscriptions
      description: ''
      consumes:
        - application/x-www-form-urlencoded
      produces:
        - application/json
      parameters:
        - name: noOfOfficeAdmins
          in: formData
          required: true
          type: string
          description: No of office admins company wants to buy or add more subscriptions, if there is none to buy just send 0 otherwise (1,2,3,...)
        - name: noOfManagers
          in: formData
          required: true
          type: string
          description:  No of managers company wants to buy or add more subscriptions, if there is none to buy just send 0 otherwise (1,2,3,...)
        - name: noOfTechnicians
          in: formData
          required: true
          type: string
          description:  No of technicians company wants to buy or add more subscriptions, if there is none to buy just send 0 otherwise (1,2,3,...)
      responses:
        '200':
          description: Success
          schema:
            $ref: '#/definitions/GeneralAPIResponse'
      security:
        - Bearer: []
  /cancelSubscriptions:
    post:
      tags:
        - Subscription
      summary: For company to cancel subscriptions
      description: ''
      consumes:
        - application/x-www-form-urlencoded
      produces:
        - application/json
      parameters:
        - name: noOfOfficeAdmins
          in: formData
          required: true
          type: string
          description: No of office admins company wants to remove from subscription, if there is none to cancel just send 0 otherwise (1,2,3,...)
        - name: noOfManagers
          in: formData
          required: true
          type: string
          description:  No of managers company wants to remove from subscription, if there is none to cancel just send 0 otherwise (1,2,3,...)
        - name: noOfTechnicians
          in: formData
          required: true
          type: string
          description: No of technicians company wants to remove from subscription, if there is none to cancel just send 0 otherwise (1,2,3,...)
      responses:
        '200':
          description: Success
          schema:
            $ref: '#/definitions/GeneralAPIResponse'
      security:
        - Bearer: []
  
securityDefinitions:
  Bearer:
    type: apiKey
    name: Authorization
    in: header
definitions:
  Industry:
    type: object
    properties:
      _id:
        type: string
      title:
        type: string
  User:
    type: object
    properties:
      _id:
        type: string
      auth:
        type: object
        properties:
          email:
            type: string
          password:
            type: string
      profile:
        type: object
        properties:
          firstName:
            type: string
          lastName:
            type: string
          displayName:
            type: string
      address:
        type: object
        properties:
          street:
            type: string
          city:
            type: string
          state:
            type: string
          zipCode:
            type: string
      contact:
        type: object
        properties:
          phone:
            type: string
      permissions:
        type: object
        properties:
          role:
            type: integer
            description: >-
              0->OFFICE_ADMIN 1->TECHNICIAN 2->MANAGER 3->COMPANY
              4->GLOBAL_ADMIN
      info:
        type: object
        description: 'Company data, returned only if the user type is company'
        properties:
          companyName:
            type: string
          logoUrl:
            type: string
          industry:
            type: string
      company:
        type: string
        description: >-
          Company id who created this user, returned if the user is an employee like a technician, manager or office admin
  EquipmentType:
    type: object
    properties:
      _id:
        type: string
      title:
        type: string
      createdBy:
        type: string
        description: >-
          Id of the company who created it, or null if the global admin
          created it.
  EquipmentBrand:
    type: object
    properties:
      _id:
        type: string
      title:
        type: string
      createdBy:
        type: string
        description: >-
          Id of the company who created it, or null if the global admin
          created it.
  Customer:
    type: object
    properties:
      _id:
        type: string
      info:
        type: object
        properties:
          name:
            type: string
          email:
            type: string
      address:
        type: object
        properties:
          street:
            type: string
          city:
            type: string
          state:
            type: string
          zipCode:
            type: string
      contact:
        type: object
        properties:
          name:
            type: string
          phone:
            type: string
      isActive:
        type: boolean
      company:
        type: string
        description: Id of company who created this customer
  CustomerEquipment:
    type: object
    properties:
      _id:
        type: string
      info:
        type: object
        properties:
          model:
            type: string
          serialNumber:
            type: string
          nfcTag:
            type: string
          imageUrl:
            type: string
      maintenance:
        type: object
        properties:
          interval:
            type: string
          nextDate:
            type: string
            format: date-time
      type:
        type: string
        description: Id of equipment type
      brand:
        type: string
        description: Id of equipment brand
      customer:
        type: string
        description: Id of customer
      jobs:
        type: array
        items:
          type: string
          description: Id's of jobs done on customers equipment
  JobType:
    type: object
    properties:
      _id:
        type: string
      title:
        type: string
      createdBy:
        type: string
        description: >-
          Id of the company who created it, or null if the global admin
          created it.
  Job:
    type: object
    properties:
      _id:
        type: string
      dateTime:
        type: string
        format: date-time
      technician:
        type: string
        description: Id of technician
      customer:
        type: string
        description: Id of customer
      type:
        type: string
        description: Id of job type
      comment:
        type: string
        description: Comment by employee who completed the job
      status:
        type: string
        description: Current status of job
      company:
        type: string
        description: Id of company who created it
  Group:
    type: object
    properties:
      _id:
        type: string
      title:
        type: string
        description: Title of the group
      company:
        type: string
        description: Id of company who created or whose employee created it.
      manager:
        type: object
        $ref: '#/definitions/User'
      members:
        type: array
        items: 
          $ref: '#/definitions/User'
  CompanyEquipment:
    type: object
    properties:
      _id:
        type: string
      info:
        type: object
        properties:
          model:
            type: string
            description: Model number of equipment
          serialNumber:
            type: string
            description: Serial number of equipment
          imageUrl:
            type: string
            description: Image url of equipment
          nfcTag:
            type: string
            description: nfcTag of equipment if provided or it will be an empty string
          qrCode:
            type: string
            description: qrCode of equipment if provided or it will be an empty string
      type:
        type: string
        description: Id of equipment type
      brand:
        type: string
        description: Id of equipment brand
      company:
        type: string
        description: Id of company who created or whose employee created it
  Invetory:
    type: object
    properties:
      _id:
        type: string
      dateTime:
        type: string
        description: Date Time when the invetory is taken
      noOfItems:
        type: number
        description: Count of items in current inventory
      createdBy:
        type: string
        description: Id of company or employee who created it
      companyEquipments:
        type: array
        items: 
          $ref: '#/definitions/CompanyEquipment'
  Order:
    type: object
    properties:
      _id:
        type: string
      info:
        type: object
        properties:
          noOfTags:
            type: string
          dateTime:  
            type: string
            description: Date Time when the order is placed
          total:
            type: string
          tax:
            type: string
          status:
            type: number
      address:
        type: object
        properties:
          street:
            type: string
          city:  
            type: string
          state:
            type: string
          zipCode:
            type: string
      company:
        type: string
        description: Id of company that placed the order
      stripeChargeId:
        type: number
        description: Id of transaction with stripe (for future use)
  Card:
    type: object
    properties:
      id:
        type: string
      ending:
        type: string
        description: Ending 4 digits of card
  GeneralAPIResponse:
    type: object
    properties:
      status:
        type: integer
        format: int32
        description: 'Status of operation, 0 -> failure 1 -> success'
        enum:
          - 0
          - 1
      message:
        type: string
        description: Error message in case of operation failure
  AuthAPIResponse:
    allOf:
      - $ref: '#/definitions/GeneralAPIResponse'
      - type: object
        properties:
          token:
            type: string
            description: Auth token to be used in next apis
          user:
            $ref: '#/definitions/User'
