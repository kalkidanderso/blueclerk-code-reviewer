        - name: action
          in: formData
          required: true
          type: number
          description: '0 for check-in and 1 for check-out'
        - name: dateTime
          in: formData
          required: true
          type: string
          description: 'date time of job. e.g. 2019-12-22 20:30:00'
        - name: nfcTag
          in: formData
          type: string
          description: required if qrCode not provided
        - name: qrCode
          in: formData
          type: string
