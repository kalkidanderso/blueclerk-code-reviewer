  /createIndustry:
    post:
      tags:
        - Industry
      summary: To create an industry
      description: Only a global admin can create an industry
      consumes:
        - application/x-www-form-urlencoded
      produces:
        - application/json
      parameters:
        - name: title
          in: formData
          required: true
          type: string
      responses:
        '200':
          description: Success
          schema:
            $ref: '#/definitions/GeneralAPIResponse'
      security:
        - Bearer: []
  /getIndustries:
    post:
      tags:
        - Industry
      summary: To get all industries
      description: ''
      consumes:
        - application/x-www-form-urlencoded
      produces:
        - application/json
      responses:
        '200':
          description: Success
          schema:
            allOf:
              - $ref: '#/definitions/GeneralAPIResponse'
              - type: object
                properties:
                  industries:
                    type: array
                    items:
                      $ref: '#/definitions/Industry'
