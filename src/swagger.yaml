            allOf:
              - $ref: '#/definitions/GeneralAPIResponse'
              - type: object
                properties:
                  users:
                    type: array
                    items:
                      $ref: '#/definitions/User'
      security:
        - Bearer: []
  /updateProfile:
    post:
      tags:
        - Users
      summary: To update profile of any user
      description: ''
      consumes:
        - application/x-www-form-urlencoded
      produces:
        - application/json
      parameters:
        - name: firstName
          in: formData
          required: true
          type: string
        - name: lastName
          in: formData
          required: true
          type: string
        - name: imageUrl
          in: formData
          type: string
        - name: street
          in: formData
          type: string
        - name: city
          in: formData
          type: string
        - name: state
          in: formData
          type: string
        - name: zipCode
          in: formData
          type: string
        - name: phone
          in: formData
          type: string
      responses:
        '200':
          description: Success
          schema:
            $ref: '#/definitions/GeneralAPIResponse'
      security:
        - Bearer: []
  /changePassword:
    post:
      tags:
        - Users
      summary: To change password of any user
      description: ''
      consumes:
        - application/x-www-form-urlencoded
      produces:
        - application/json
      parameters:
        - name: currentPassword
          in: formData
          required: true
          type: string
        - name: newPassword
          in: formData
          required: true
          type: string
      responses:
        '200':
          description: Success
          schema:
            $ref: '#/definitions/GeneralAPIResponse'
      security:
        - Bearer: []
  /forgotPassword:
    post:
      tags:
        - Users
      summary: To change password of any user
      description: ''
      consumes:
        - application/x-www-form-urlencoded
      produces:
        - application/json
      parameters:
        - name: email
          in: formData
          required: true
          type: string
      responses:
        '200':
          description: Success
          schema:
            $ref: '#/definitions/GeneralAPIResponse'
  /deleteEmployee:
    post:
      tags:
        - Users
      summary: To delete user (technician, manager or office admin)
      description: ''
      consumes:
