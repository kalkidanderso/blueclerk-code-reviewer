      description
      description: 'Disconnect from QB and **will reset QB synced status** for: Customer, Job Type, Item, Payment Term, Invoice, and Payment'
      consumes:
        - application/x-www-form-urlencoded
      produces:
        - application/json
      parameters: []
      responses:
        '200':
          description: Success
          schema:
            $ref: '#/definitions/GeneralAPIResponse'
      security:
        - Bearer: []
  /createIntegrationServiceTicket:
    post:
      tags:
        - Integration
      summary: Create service ticket via web
      description: ''
      consumes:
        - multipart/form-data
      produces:
        - application/json
      parameters:
        - name: source
          in: formData
          required: true
          type: string
          enum:
            - web
          description: The source of Service Ticket (this one from web)
        - name: name
          in: formData
          required: true
          type: string
          description: Name of the customer
        - name: email
          in: formData
          required: true
          type: string
          description: Email of the customer
        - name: street
          in: formData
          type: string
          description: Street address of the customer
        - name: unit
          in: formData
          type: string
          description: Unit of the customer
        - name: city
          in: formData
          type: string
          description: City of the customer
        - name: state
          in: formData
          required: true
          type: string
          description: State of the customer
        - name: zipCode
          in: formData
          type: string
          description: Zip Code of the customer
        - name: phone
          in: formData
          required: true
          type: string
          description: Phone of the customer
        - name: fax
          in: formData
          type: string
          description: Fax of the customer
        - name: warranty
          in: formData
          type: string
          description: Service ticket warranty
        - name: itemId
          in: formData
          type: string
          description: Id of job type selected from the list received by /getJobTypes api
        - name: workToBeDone
          in: formData
          type: string
          description: What work to be done
        - name: preferredDateTime
          in: formData
          type: string
          description: Preferred date/time of work
        - name: image
          in: formData
          type: file
        - name: note
          in: formData
          type: string
        - name: companyId
          in: formData
          type: string
          description: Id of company if contractor is hitting for other company
      responses:
        '200':
          description: Success
          schema:
            $ref: '#/definitions/GeneralAPIResponse'
      security:
        - Bearer: []
  /script/syncItemTier:
    post:
      tags:
        - Script
      summary: To update all companies and customers to have Item Price Tier
      description: >
        **WARNING: Only do this when you know what you are doing.** This will update all companies and customers those don't have Item Price Tier. Will create 1 new Item Tier for the company to be the default tier and update all customers of that company to use the default tier.
      consumes:
        - application/x-www-form-urlencoded
      produces:
        - application/json
      parameters: []
      responses:
        '200':
          description: Success
          schema:
            $ref: '#/definitions/GeneralAPIResponse'
      security:
        - Bearer: []
securityDefinitions:
  Bearer:
    type: apiKey
    name: Authorization
    in: header
definitions:
  Industry:
    type: object
    properties:
      _id:
        type: string
      title:
        type: string
  User:
    type: object
    properties:
      _id:
        type: string
      auth:
        type: object
        properties:
          email:
            type: string
          password:
            type: string
      profile:
        type: object
        properties:
          firstName:
            type: string
          lastName:
            type: string
          displayName:
            type: string
      address:
        type: object
        properties:
          street:
            type: string
          city:
            type: string
          state:
            type: string
          zipCode:
            type: string
      contact:
        type: object
        properties:
          phone:
            type: string
      permissions:
        type: object
        properties:
          role:
            type: integer
            description: >-
              0->OFFICE_ADMIN 1->TECHNICIAN 2->MANAGER 3->COMPANY
              4->GLOBAL_ADMIN
      info:
        type: object
        description: 'Company data, returned only if the user type is company'
        properties:
          companyName:
            type: string
          logoUrl:
            type: string
          industry:
            type: string
      company:
        type: string
        description: >-
          Company id who created this user, returned if the user is an employee like a technician, manager or office admin
  EquipmentType:
    type: object
    properties:
      _id:
        type: string
      title:
        type: string
      industry:
        type: string
        description: Id of industry to which this type belongs. 
      createdBy:
        type: string
        description: >-
          Id of the company who created it, or null if the global admin
          created it.
  EquipmentBrand:
    type: object
    properties:
      _id:
        type: string
      title:
        type: string
      createdBy:
        type: string
        description: >-
          Id of the company who created it, or null if the global admin
          created it.
  Customer:
    type: object
    properties:
      _id:
        type: string
      info:
        type: object
        properties:
          name:
            type: string
          email:
            type: string
      address:
        type: object
        properties:
          street:
            type: string
          city:
            type: string
          state:
            type: string
          zipCode:
            type: string
      contact:
        type: object
        properties:
          name:
            type: string
          phone:
            type: string
      isActive:
        type: boolean
      company:
        type: string
        description: Id of company who created this customer
      contactName:
        type: string
      balance:
        type: number
        description: how much customer owe to the company
      vendorId:
        type: string
        description: VendorId
      quickbookId:
        type: string
        description: ID of associated customer in QuickBooks
  CustomerEquipment:
    type: object
    properties:
      _id:
        type: string
      info:
        type: object
        properties:
          model:
            type: string
          serialNumber:
            type: string
          nfcTag:
            type: string
          imageUrl:
            type: string
      maintenance:
        type: object
        properties:
          interval:
            type: string
          nextDate:
            type: string
            format: date-time
      type:
        type: string
        description: Id of equipment type
      brand:
        type: string
        description: Id of equipment brand
      customer:
        type: string
        description: Id of customer
  LocationTag:
    type: object
    properties:
      _id:
        type: string
      info:
        type: object
        properties:
          nfcTag:
            type: string
      latitude:
        type: string
      longitude:
        type: string
      note:
        type: string
        description: note (optional)
      address:
        type: string
        description: addtitional address of the location where tag is coded (optional)
      customer:
        type: string
        description: Id of customer for whome the code is coded for
      company:
        type: string
        description: Id of comapny to whom tag belongs
      createdBy:
        type: string
      createdAt:
        type: string
        format: date-time
  JobType:
    type: object
    properties:
      _id:
        type: string
      title:
        type: string
      industry:
        type: string
        description: industry id for whome the job type was created
      createdBy:
        type: string
        description: >-
          Id of the company who created it, or null if the global admin
          created it.
  Item:
    type: object
    properties:
      _id:
        type: string
      name:
        type: string
      isFixed:
        type: boolean
        description: default will be fixed
      charges:
        type: number
      tax:
        type: number
      company:
        type: string
        description: >-
          Id of the company who created it.
      quickbookId:
        type: string
        description: ID of associated product in QuickBooks
  JobCharges:
    type: object
    properties:
      _id:
        type: string
      isFixed:
        type: string
        description: If the job is fixed or hourly
      charges:
        type: number
        description: Charges form job type or if entered custom charges while creating a job
      jobType:
        type: object
        properties:
          title:
            type: string
            description: Title of jo type
  Invoice:
    type: object
    properties:
      _id:
        type: string
      invoiceId:
        type: string
        description: Custom invoice id to be shown on invoice
      inoviceType:
        type: number
        description: 0 for the invoice for job and 1 for the invoice of purchase order
      job:
        type: string
        description: Id of job from which the invoice was created
      purchaseOrder:
        type: string
        description: Id of the purchase order if the invoic is for purchase order only
      issuedDate:
        type: string
        description: Issued date of the invoice
      dueDate:
        type: string
        description: Due date of the invoice
      estimate:
        type: string
        description: Id of the estimate if the invoic is for estimate only
      jobPurchaseOrders:
        type: array
        items:
          type: string
      customer:
        type: string
        description: Id of cusomer from whom the invoice was created
      company:
        type: string
        description: Id of company to whom this invoice belongs
      charges: 
        type: number
        description: Charges amount from job or if you have customized while creating invoice
      taxPercentage:
        type: number
        description: Tax percentage applied to invoice default will be 0
      tax:
        type: number
        description: Tax amount to be added in charges to caculate the total invoice
      total:
