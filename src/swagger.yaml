swagger: '2.0'
info:
  title: BlueClerk
  description: APIs for both app and website
  version: 1.0.0
host: 'localhost:3006'
basePath: /api/v1
schemes:
  - http
tags:
  - name: Auth
    description: For login and signup
  - name: Industry
    description: For the industry company works in
  - name: Users
    description: For all kind of users
  - name: Equipment Type
    description: For equipment types
  - name: Equipment Brand
    description: For equipment brands
  - name: Customer
    description: For customers of a company
  - name: Customer Equipment
    description: For equipments of a customer
  - name: Company Equipment
  - name: Company Card
    description: For payment methods of a company
  - name: Company Equipment History
    description: For company equipment's Check In Check Out history
  - name: Inventory
    description: For Inventory of company equipments
  - name: Job Type
    description: For job types
  - name: Job
    description: For scheduled jobs
  - name: Image
    description: For images
  - name: Group
    description: For Groups  
  - name: Tags
    description: For Placing Tags Order
  - name: Subscription
    description: For compay to subscribe and unsubscribe
    
paths:
  /login:
    post:
      tags:
        - Auth
      summary: Login all kind of users and get auth token for further requests
      description: ''
      consumes:
        - application/x-www-form-urlencoded
      produces:
        - application/json
      parameters:
        - name: email
          in: formData
          required: true
          type: string
        - name: password
          in: formData
          required: true
          type: string
      responses:
        '200':
          description: Success
          schema:
            $ref: '#/definitions/AuthAPIResponse'
  /signUp:
    post:
      tags:
        - Auth
      summary: Sign up for company
      description: ''
      consumes:
        - application/x-www-form-urlencoded
      produces:
        - application/json
      parameters:
        - name: email
          in: formData
          required: true
          type: string
        - name: password
          in: formData
          required: true
          type: string
        - name: firstName
          in: formData
          required: true
          type: string
        - name: lastName
          in: formData
          required: true
          type: string
        - name: phone
          in: formData
          required: true
          type: string
        - name: companyName
          in: formData
          required: true
          type: string
        - name: industryId
          in: formData
          description: >-
            Id of the selected industry from the industries fetched with
            /getIndustries api
          required: true
          type: string
      responses:
        '200':
          description: Success
          schema:
            $ref: '#/definitions/AuthAPIResponse'
  /adminSignUp:
    post:
      tags:
        - Auth
      summary: Sign up for global admin
      description: ''
      consumes:
        - application/x-www-form-urlencoded
      produces:
        - application/json
      parameters:
        - name: email
          in: formData
          required: true
          type: string
        - name: password
          in: formData
          required: true
          type: string
        - name: firstName
          in: formData
          required: true
          type: string
        - name: lastName
          in: formData
          required: true
          type: string
        - name: phone
          in: formData
          required: true
          type: string
      responses:
        '200':
          description: Success
          schema:
            $ref: '#/definitions/AuthAPIResponse'
  /createIndustry:
    post:
      tags:
        - Industry
      summary: To create an industry
      description: Only a global admin can create an industry
      consumes:
        - application/x-www-form-urlencoded
      produces:
        - application/json
      parameters:
        - name: title
          in: formData
          required: true
          type: string
      responses:
        '200':
          description: Success
          schema:
            $ref: '#/definitions/GeneralAPIResponse'
      security:
        - Bearer: []
  /getIndustries:
    post:
      tags:
        - Industry
      summary: To get all industries
      description: ''
      consumes:
        - application/x-www-form-urlencoded
      produces:
        - application/json
      responses:
        '200':
          description: Success
          schema:
            allOf:
              - $ref: '#/definitions/GeneralAPIResponse'
              - type: object
                properties:
                  industries:
                    type: array
                    items:
                      $ref: '#/definitions/Industry'
  /createManager:
    post:
      tags:
        - Users
      summary: To create a manager
      description: ''
      consumes:
        - application/x-www-form-urlencoded
      produces:
        - application/json
