name: AI Code Review (Groq)

on:
  pull_request:
    branches:
      - staging
      - master
      - main
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    name: Review changed files with Groq AI

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Get list of changed files
        id: changed-files
        run: |
          echo "Detecting changed files..."
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.sha }}"
          git diff --name-only "$BASE" "$HEAD" > changed_files.txt
          echo "Changed files:"
          cat changed_files.txt

      - name: Run Groq AI code review
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          SKIPPED=("package.json" "package-lock.json" ".env" ".gitignore")

          while IFS= read -r file; do
            # Skip non-existent files (deleted)
            if [[ ! -f "$file" ]]; then
              echo "Skipping (deleted): $file"
              continue
            fi

            # Skip non-code files
            if [[ "$file" != *.ts && "$file" != *.js && "$file" != *.json ]]; then
              echo "Skipping (non-code): $file"
              continue
            fi

            # Skip specific files
            SKIP=false
            for skip_file in "${SKIPPED[@]}"; do
              if [[ "$file" == *"$skip_file"* ]]; then
                SKIP=true
                break
              fi
            done

            if $SKIP; then
              echo "Skipping (excluded): $file"
              continue
            fi

            echo "Reviewing: $file"
            node review_code.js "$file"

          done < changed_files.txt
