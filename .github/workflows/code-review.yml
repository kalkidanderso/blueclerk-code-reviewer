name: AI Code Review (Groq)

on:
  pull_request:
    branches:
      - staging
      - master
      - main
    types: [opened, synchronize]

permissions:
  pull-requests: write
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    name: Review changed files with Groq AI

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          mkdir -p /tmp/review-deps
          cd /tmp/review-deps
          npm init -y
          npm install axios

      - name: Get list of changed files
        run: |
          echo "Detecting changed files..."
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.sha }}"
          git diff --name-only "$BASE" "$HEAD" > changed_files.txt
          echo "Changed files:"
          cat changed_files.txt

      - name: Run Groq AI code review and post PR comment
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NODE_PATH: /tmp/review-deps/node_modules
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SKIPPED=("package.json" "package-lock.json" ".env" ".gitignore")
          FULL_REVIEW="## 🤖 Groq AI Code Review\n\n"
          HAS_REVIEW=false

          while IFS= read -r file; do
            # Skip non-existent files (deleted)
            if [[ ! -f "$file" ]]; then
              echo "Skipping (deleted): $file"
              continue
            fi

            # Skip non-code files
            if [[ "$file" != *.ts && "$file" != *.js ]]; then
              echo "Skipping (non-code): $file"
              continue
            fi

            # Skip specific files
            SKIP=false
            for skip_file in "${SKIPPED[@]}"; do
              if [[ "$file" == *"$skip_file"* ]]; then
                SKIP=true
                break
              fi
            done

            if $SKIP; then
              echo "Skipping (excluded): $file"
              continue
            fi

            echo "Reviewing: $file"
            REVIEW=$(node review_code.js "$file")
            FULL_REVIEW="${FULL_REVIEW}### 📄 \`${file}\`\n\n${REVIEW}\n\n---\n\n"
            HAS_REVIEW=true

          done < changed_files.txt

          if [ "$HAS_REVIEW" = true ]; then
            echo "Posting review comment on PR..."
            printf "%b" "$FULL_REVIEW" | gh pr comment ${{ github.event.pull_request.number }} --body-file -
          else
            echo "No reviewable files found."
          fi
