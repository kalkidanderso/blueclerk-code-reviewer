name: AI Code Review (Groq)

on:
  pull_request:
    branches:
      - staging
      - master
      - main
    types: [opened, synchronize]

permissions:
  pull-requests: write
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    name: Review changed files with Groq AI

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          mkdir -p /tmp/review-deps
          cd /tmp/review-deps
          npm init -y
          npm install axios

      - name: Get list of changed files
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.sha }}"
          git diff --name-only "$BASE" "$HEAD" > changed_files.txt
          echo "Changed files:"
          cat changed_files.txt

      - name: Run Groq AI review on each file
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NODE_PATH: /tmp/review-deps/node_modules
        run: |
          SKIPPED=("package.json" "package-lock.json" ".env" ".gitignore" "package-lock")
          echo "[]" > reviews.json

          while IFS= read -r file; do
            # Skip deleted files
            if [[ ! -f "$file" ]]; then
              echo "⏭ Skipping (deleted): $file"
              continue
            fi

            # Only review .ts and .js files
            if [[ "$file" != *.ts && "$file" != *.js ]]; then
              echo "⏭ Skipping (non-code): $file"
              continue
            fi

            # Skip excluded files
            SKIP=false
            for s in "${SKIPPED[@]}"; do
              [[ "$file" == *"$s"* ]] && SKIP=true && break
            done
            $SKIP && echo "⏭ Skipping (excluded): $file" && continue

            echo "🔍 Reviewing: $file"
            RESULT=$(node review_code.js "$file" 2>&1)

            # Append result to reviews array
            CURRENT=$(cat reviews.json)
            echo "$CURRENT" | node -e "
              const data = JSON.parse(require('fs').readFileSync('/dev/stdin','utf-8'));
              const result = $(echo "$RESULT" | head -1);
              data.push(result);
              console.log(JSON.stringify(data));
            " > reviews.json || echo "⚠️  Failed to parse review for $file"

          done < changed_files.txt

          echo "Collected reviews:"
          cat reviews.json | node -e "const d=JSON.parse(require('fs').readFileSync('/dev/stdin','utf-8')); console.log('Files reviewed:', d.length);"

      - name: Post review as PR inline comments
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_PATH: /tmp/review-deps/node_modules
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.sha }}
        run: node post_review.js
