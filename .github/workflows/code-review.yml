name: Code Review and Build Workflow

on:
  pull_request:
    branches:
      - staging
      - master
      - feat/code-review
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2
        with:
          fetch-depth: 2  # Fetch a minimal number of commits

      - name: Setup Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Get list of changed files
        id: changed-files
        run: |
          echo "Changed files:"
          if [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            git diff --name-only ${{ github.event.before }} ${{ github.sha }} > changed_files.txt
          else
            # Handle cases where there's no valid 'before' hash (e.g., for new branches)
            git diff --name-only HEAD^ > changed_files.txt
          fi
          cat changed_files.txt

      - name: Run code review
        env:
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_DEPLOYMENT_NAME: ${{ secrets.AZURE_OPENAI_DEPLOYMENT_NAME }}
        run: |
          while IFS= read -r file; do
            # Skip package.json and package-lock.json
            if [[ $file == "package.json" || $file == "package-lock.json" ]]; then
              echo "Skipping review for $file"
              continue
            fi
            
            if [[ -f $file ]]; then
              echo "Reviewing $file"
              node review_code.js $file
            else
              echo "$file does not exist, skipping"
            fi
          done < changed_files.txt